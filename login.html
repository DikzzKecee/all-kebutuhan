<!DOCTYPE html>
<html lang="id">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Dikzz Tools — Login</title>

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="bg-glow"></div>


<header class="navbar">

  <a class="brand" href="#">
    <span>◉</span>
    Dikzz Tools
  </a>

</header>


<main class="login-page">

  <section class="login-card">

    <div class="login-logo">
      ◉
    </div>

    <h1>
      Welcome
    </h1>

    <p>
      Masukkan email kamu untuk masuk
      ke Dikzz Tools.
    </p>


    <div
      id="loginError"
      class="login-error"
    ></div>


    <form
      id="loginForm"
      class="login-form"
    >

      <label for="loginEmail">
        Email
      </label>

      <input
        id="loginEmail"
        type="email"
        placeholder="nama@email.com"
        autocomplete="email"
        required
      >


      <button
        id="loginButton"
        class="primary-btn login-submit"
        type="submit"
      >
        Masuk ke Website
      </button>

    </form>


    <p class="login-note">
      Kami hanya menggunakan email untuk
      identitas akun dan riwayat login.
      Password tidak diperlukan dan tidak disimpan.
    </p>

  </section>

</main>


<footer>
  © 2026 Dikzz Tools • Secure Login
</footer>


<script src="script.js"></script>

</body>
</html>
